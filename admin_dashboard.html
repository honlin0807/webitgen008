<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="dashboard-body">
    <header class="admin-header">
        <a href="index.html">NEIVCE Trading PLT</a>
        <div>
            Welcome, <span id="adminUsername">Admin</span> |
            <a href="admin_logout.html" id="logoutBtn">Log out</a>
        </div>
    </header>

    <main class="dashboard">
        <h1>Admin Dashboard</h1>
        <p>Change the information below and click Save Changes.</p>
        <div id="statusMessage" style="margin: 15px 0;"></div>

        <form id="editorForm" class="editor-form">
            <section>
                <h2>Home Page</h2>
                <p><strong>Company Name:</strong> <span data-content="company_name">NEIVCE Trading PLT</span> (fixed)</p>
                <label for="announcement">Homepage Announcement</label>
                <textarea id="announcement" rows="3"></textarea>
                <label for="introduction">Company Introduction</label>
                <textarea id="introduction" rows="4"></textarea>
            </section>

            <section>
                <h2>About Us</h2>
                <label for="about">Company Background</label>
                <textarea id="about" rows="4"></textarea>
                <label for="mission">Mission</label>
                <textarea id="mission" rows="2"></textarea>
                <label for="vision">Vision</label>
                <textarea id="vision" rows="2"></textarea>
                <label for="values">Values</label>
                <textarea id="values" rows="2"></textarea>
            </section>

            <section>
                <h2>Services</h2>
                <label for="ecommerce">E-commerce Description</label>
                <textarea id="ecommerce" rows="3"></textarea>
                <label for="programming">Programming Description</label>
                <textarea id="programming" rows="3"></textarea>
                <label for="training">Computer Training Description</label>
                <textarea id="training" rows="3"></textarea>
            </section>

            <section>
                <h2>Contact Details</h2>
                <label for="address">Address</label>
                <textarea id="address" rows="3"></textarea>
                <label for="telephone">Telephone Number</label>
                <input type="text" id="telephone">
                <label for="contact_about">About Company</label>
                <textarea id="contact_about" rows="4"></textarea>
            </section>

            <input type="submit" class="save-button" value="Save Changes">
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/main.js"></script>
    <script>

        const currentAdmin = sessionStorage.getItem('admin_username');
        if (!currentAdmin) {
            window.location.href = 'admin_login.html';
        } else {
            document.getElementById('adminUsername').textContent = currentAdmin;
        }

        const fields = [
            'announcement', 'introduction', 'about', 'mission', 'vision', 
            'values', 'ecommerce', 'programming', 'training', 'address', 
            'telephone', 'contact_about'
        ];


        function populateFields(data) {
            fields.forEach(field => {
                const el = document.getElementById(field);
                if (el && data[field] !== undefined) {
                    el.value = data[field];
                }
            });
        }


        populateFields(getSiteData());


        if (typeof fetchSiteDataFromSupabase === 'function') {
            fetchSiteDataFromSupabase().then(cloudData => {
                if (cloudData) {
                    populateFields(cloudData);
                }
            });
        }

        document.getElementById('editorForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.querySelector('input[type="submit"].save-button');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.value = 'Saving...';
            }

            const updatedData = Object.assign({}, getSiteData());
            fields.forEach(field => {
                const el = document.getElementById(field);
                if (el) {
                    updatedData[field] = el.value;
                }
            });

            const res = await saveSiteData(updatedData);
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.value = 'Save Changes';
            }

            const statusMsg = document.getElementById('statusMessage');
            const syncText = (res && res.cloud) ? ' (Synced to Supabase Cloud ☁️)' : '';
            statusMsg.innerHTML = '<p class="notice success">Website content updated successfully' + syncText + '. <a href="index.html" target="_blank">View Website &rarr;</a></p>';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            sessionStorage.removeItem('admin_username');
            window.location.href = 'admin_login.html';
        });
    </script>
</body>
</html>
